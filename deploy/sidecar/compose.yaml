services:
  knowl:
    image: ${KNOWL_IMAGE:-ghcr.io/baldaworks/knowl:local}
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - knowl-data:/var/lib/knowl
      - ./sources/engineering:/sources/engineering:ro
      - ./sources/operations:/sources/operations:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  knowl-data: {}
