runtime:
  providers:
    antigravity:
      type: antigravity_acp
      antigravity_acp:
        model: gemini-3.7-flash-medium

knowl:
  provider: antigravity
  workspace:
    path: knowledge
  storage:
    type: sqlite
    sqlite:
      path: knowledge/.knowl/state.db
  scope: local
  sources:
    - id: engineering-docs
      type: filesystem
      filesystem:
        root: sources
        include:
          - "**/*.md"
        flavor: markdown
