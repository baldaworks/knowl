{{define "wiki_pages"}}<ul class="wiki-page-list nav sidebar-menu nav-indent flex-column mb-0" data-wiki-pages="{{.Directory}}">{{range .Items}}<li class="nav-item" data-page-node="{{.NodeKey}}" data-page-path="{{.Path}}">{{if .ChildrenURL}}<button type="button" class="btn btn-sm wiki-page-caret" data-page-toggle data-page-url="{{.ChildrenURL}}" aria-label="Expand {{.Title}}" aria-expanded="false"><span aria-hidden="true">▸</span></button>{{end}}{{if .PageID}}<a class="nav-link" href="{{.URL}}" data-wiki-page="{{.PageID}}">{{.Title}}</a>{{else}}<span class="nav-link" data-wiki-group>{{.Title}}</span>{{end}}{{if .ChildrenURL}}<div class="nav-treeview" data-page-branch hidden></div>{{end}}</li>{{else}}<li class="text-body-secondary" data-page-empty>No child pages.</li>{{end}}{{if .Next}}<li data-page-continuation><button type="button" class="btn btn-outline-light btn-sm" data-page-more data-page-url="{{.Next}}">More</button></li>{{end}}</ul>{{end}}
