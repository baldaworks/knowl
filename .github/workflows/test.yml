name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Verify modules
        run: go mod verify

      - name: Verify tidy modules
        run: go mod tidy -diff

      - name: Verify generated OpenAPI bindings
        run: |
          go generate ./internal/httpapi/knowlapi
          git diff --exit-code -- internal/httpapi/knowlapi/server.gen.go

      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Verify modules
        run: go mod verify

      - name: Vulnerability scan
        run: go tool govulncheck ./...
