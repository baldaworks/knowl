version: 1

allow:
  depOnAnyVendor: true

excludeFiles:
  - "^.*_test\\.go$"

components:
  cli:
    in: cmd/knowl
  host:
    in: pkg/knowl
  fx:
    in: pkg/knowlfx
  app:
    in: pkg/knowl/app
  types:
    in: pkg/knowl/types
  okf:
    in: pkg/knowl/okf
  wiki:
    in: pkg/knowl/wiki
  content:
    in: pkg/knowl/content/**
  store:
    in: pkg/knowl/store/**
  provider:
    in: pkg/knowl/provider
  mcp:
    in: pkg/knowl/mcp
  mcphttp:
    in: internal/mcphttp
  httpapi:
    in: internal/httpapi/**
  source:
    in: internal/source/**
  testsupport:
    in: pkg/knowl/internal/**
  examples:
    in: examples/**

deps:
  wiki:
    mayDependOn:
      - types
      - okf
  types:
    mayDependOn:
      - okf
  app:
    mayDependOn:
      - types
      - wiki
      - okf
  content:
    mayDependOn:
      - app
      - types
      - wiki
      - okf
  store:
    mayDependOn:
      - store
      - app
      - types
      - wiki
      - okf
  provider:
    mayDependOn:
      - app
      - types
  mcp:
    mayDependOn:
      - app
      - types
      - okf
  mcphttp:
    mayDependOn:
      - mcp
  httpapi:
    mayDependOn:
      - httpapi
      - app
      - types
      - okf
  source:
    mayDependOn:
      - source
      - app
      - types
      - okf
  host:
    mayDependOn:
      - app
      - types
      - content
      - store
      - provider
      - mcp
      - mcphttp
      - httpapi
      - source
  fx:
    mayDependOn:
      - host
  cli:
    mayDependOn:
      - host
      - fx
      - app
      - source
      - content
      - provider
      - types
      - httpapi
      - okf
  testsupport:
    mayDependOn:
      - app
      - content
      - types
