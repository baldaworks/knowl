version: v1

runtime:
  providers:
    codex-acp:
      type: codex_acp
      codex_acp:
        model: gpt-5.6-luna
        reasoning_effort: xhigh
        extra_args:
          - --debug

diffpal:
  provider: codex-acp
  gate:
    block_on: high
  review:
    language: en
    timeout: 15m
    instructions: |
      Prefer actionable findings that are directly supported by the diff.

profiles:
  local:
    diffpal:
      gate:
        block_on: high
