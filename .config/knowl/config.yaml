runtime:
  providers:
    antigravity:
      type: antigravity_acp
      antigravity_acp:
        model: gemini-3.8-flash-medium

knowl:
  provider: antigravity
  workspace:
    path: ./knowledge
  storage:
    type: sqlite
    sqlite:
      path: .knowl/knowl.sqlite
  scope: local
  server:
    listen_addr: 127.0.0.1:8080
  operator:
    token: replace-with-a-local-secret
  sources:
    - id: knowl-docs
      type: filesystem
      filesystem:
        root: docs
        include:
          - "**/*.md"
        flavor: markdown
