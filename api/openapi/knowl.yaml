openapi: 3.0.3
info:
  title: Knowl HTTP API
  version: v1
  description: |
    Canonical public HTTP contract for Knowl.

    The host owns the trusted knowledge scope. Any non-empty `scope` query
    override on `/v1/*` is rejected with `scope_override_forbidden`.
servers:
  - url: http://127.0.0.1:8080
    description: Default local listener
tags:
  - name: health
  - name: knowledge
  - name: operations
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      responses:
        '200':
          description: The host process is serving HTTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      tags: [health]
      operationId: getReady
      summary: Readiness probe
      responses:
        '200':
          description: Workspace recovery, SQL setup, and projection preparation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Startup or recovery is not complete yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /v1/retrieve:
    get:
      tags: [knowledge]
      operationId: retrieveKnowledge
      summary: Retrieve bounded evidence from the trusted Knowl scope
      description: |
        Returns bounded grounded evidence and provenance for one query.

        When the host configures an operator token, callers must send it as a
        bearer token. Trusted in-process operator workflows bypass HTTP auth.

        Supplying a non-empty `scope` query parameter is forbidden and yields
        `scope_override_forbidden`.
      parameters:
        - $ref: '#/components/parameters/RetrieveQuery'
        - $ref: '#/components/parameters/RetrieveSource'
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Bounded retrieval result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveResult'
        '400':
          $ref: '#/components/responses/QueryStringBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeOverrideForbidden'
        '422':
          $ref: '#/components/responses/OperationFailed'
        '503':
          $ref: '#/components/responses/UnavailableError'
  /v1/ingest:
    post:
      tags: [knowledge]
      operationId: ingestKnowledge
      summary: Submit one bounded source to the trusted Knowl ingest pipeline
      description: |
        Accepts one text payload or one URI reference, then runs the canonical
        ingest lifecycle until the durable operation reaches its public terminal
        state.

        Supplying a non-empty `scope` query parameter is forbidden and yields
        `scope_override_forbidden`.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '200':
          description: Durable ingest result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '400':
          $ref: '#/components/responses/JSONBodyBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeOverrideForbidden'
        '422':
          $ref: '#/components/responses/OperationFailed'
        '503':
          $ref: '#/components/responses/UnavailableError'
  /v1/operations/{operation_id}:
    get:
      tags: [operations]
      operationId: getOperation
      summary: Read one durable Knowl operation status
      description: |
        Returns the public operation status model compatible with
        `queued -> running -> completed | failed`.

        Supplying a non-empty `scope` query parameter is forbidden and yields
        `scope_override_forbidden`.
      parameters:
        - $ref: '#/components/parameters/OperationID'
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Durable operation status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '400':
          $ref: '#/components/responses/OperationIDBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeOverrideForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/OperationFailed'
        '503':
          $ref: '#/components/responses/UnavailableError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Required for business endpoints when `knowl.operator.token` is configured.
  parameters:
    RetrieveQuery:
      name: query
      in: query
      required: true
      schema:
        type: string
        minLength: 1
      description: Free-text retrieval query.
    RetrieveSource:
      name: source
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
      description: Optional repeatable source identity filter. Empty means all sources and curated pages.
    OperationID:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    QueryStringBadRequest:
      description: Missing or invalid query string.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            query_required:
              value:
                error: query_required
            invalid_request:
              value:
                error: invalid_request
            invalid_source_filter:
              value:
                error: invalid_source_filter
    JSONBodyBadRequest:
      description: Invalid JSON body or invalid request semantics.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_json:
              value:
                error: invalid_json
            multiple_json_values:
              value:
                error: multiple_json_values
            invalid_request:
              value:
                error: invalid_request
    OperationIDBadRequest:
      description: Invalid operation ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: operation_id_invalid
    ScopeOverrideForbidden:
      description: Caller attempted to override the trusted host scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: scope_override_forbidden
    Unauthorized:
      description: The configured operator bearer token is missing or invalid.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: unauthorized
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: not_found
    UnavailableError:
      description: The host is not ready yet or the service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_ready:
              value:
                error: not_ready
            service_unavailable:
              value:
                error: service_unavailable
            maintainer_unavailable:
              value:
                error: maintainer_unavailable
    OperationFailed:
      description: The operation failed or an unclassified application error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: operation_failed
  schemas:
    HealthResponse:
      type: object
      required: [service, status]
      properties:
        service:
          type: string
          example: knowl
        status:
          type: string
          enum: [ok]
    ReadyResponse:
      type: object
      required: [service, status]
      properties:
        service:
          type: string
          example: knowl
        status:
          type: string
          enum: [ready, not_ready]
        scope:
          type: string
          description: Trusted scope reported only when the host is ready.
          example: local
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Citation:
      type: object
      required: [kind, reference, untrusted]
      properties:
        kind:
          type: string
          enum: [wiki, raw]
        reference:
          type: string
        page_id:
          type: string
        path:
          type: string
        source_ref:
          type: string
        untrusted:
          type: boolean
    EvidenceItem:
      type: object
      required: [page_id, title, snippet, untrusted]
      properties:
        page_id:
          type: string
        title:
          type: string
        snippet:
          type: string
        source_refs:
          type: array
          items:
            type: string
        source_id:
          type: string
        document_id:
          type: string
        revision:
          type: string
        uri:
          type: string
        untrusted:
          type: boolean
    RetrieveResult:
      type: object
      required: [query, evidence]
      properties:
        query:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceItem'
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
    IngestRequest:
      type: object
      properties:
        content:
          type: string
          description: Raw source content.
        uri:
          type: string
          description: External source URI.
        media_type:
          type: string
        origin:
          type: string
        idempotency_key:
          type: string
      additionalProperties: false
    IngestResult:
      type: object
      required: [operation_id, status]
      properties:
        operation_id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
    Failure:
      type: object
      required: [class, operation_id]
      properties:
        class:
          type: string
        operation_id:
          type: string
    OperationResult:
      type: object
      required: [id, status, updated_at]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        updated_at:
          type: string
          format: date-time
        failure:
          $ref: '#/components/schemas/Failure'
