openapi: 3.0.3
info:
  title: Knowl HTTP API
  version: v1
  description: |
    Canonical public HTTP contract for Knowl.

    The host owns the trusted knowledge scope. Any non-empty `scope` query
    override on `/v1/*` is rejected with `scope_override_forbidden`.
servers:
  - url: http://127.0.0.1:8080
    description: Default local listener
tags:
  - name: health
  - name: knowledge
  - name: operations
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      responses:
        '200':
          description: The host process is serving HTTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      tags: [health]
      operationId: getReady
      summary: Readiness probe
      responses:
        '200':
          description: Workspace recovery, SQL setup, and projection preparation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Startup or recovery is not complete yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /v1/retrieve:
    get:
      tags: [knowledge]
      operationId: retrieveKnowledge
      summary: Retrieve bounded evidence from the trusted Knowl scope
      description: |
        Returns bounded grounded evidence and provenance for one query.

        When the host configures an operator token, callers must send it as a
        bearer token. Trusted in-process operator workflows bypass HTTP auth.

        Supplying a non-empty `scope` query parameter is forbidden and yields
        `scope_override_forbidden`.
      parameters:
        - $ref: '#/components/parameters/RetrieveQuery'
        - $ref: '#/components/parameters/RetrieveSource'
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Bounded retrieval result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveResult'
        '400':
          $ref: '#/components/responses/QueryStringBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeOverrideForbidden'
        '422':
          $ref: '#/components/responses/OperationFailed'
        '503':
          $ref: '#/components/responses/UnavailableError'
  /v1/ingest:
    post:
      tags: [knowledge]
      operationId: ingestKnowledge
      summary: Submit supplied text or a URI reference to the trusted ingest pipeline
      description: |
        Supply exactly one non-empty `content` or `uri`. URI input stores the
        supplied URI string as reference text; Knowl does not download the
        document at that address. To ingest document text already obtained by
        your application, submit it through `content` and optionally use `origin`
        as its source identity hint. Origin addresses are not fetched either.

        Returns a durable operation ID and its current status. Queued work is
        processed by the maintenance worker; poll `/v1/operations/{id}` for the
        terminal outcome.

        Supplying a non-empty `scope` query parameter is forbidden and yields
        `scope_override_forbidden`.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '200':
          description: Durable ingest result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '400':
          $ref: '#/components/responses/JSONBodyBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeOverrideForbidden'
        '422':
          $ref: '#/components/responses/OperationFailed'
        '503':
          $ref: '#/components/responses/UnavailableError'
  /v1/operations/{operation_id}:
    get:
      tags: [operations]
      operationId: getOperation
      summary: Read one durable Knowl operation status
      description: |
        Returns the public operation status model compatible with
        `queued -> running -> completed | failed`.

        Supplying a non-empty `scope` query parameter is forbidden and yields
        `scope_override_forbidden`.
      parameters:
        - $ref: '#/components/parameters/OperationID'
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Durable operation status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '400':
          $ref: '#/components/responses/OperationIDBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeOverrideForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/OperationFailed'
        '503':
          $ref: '#/components/responses/UnavailableError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Required for business endpoints when `knowl.operator.token` is configured.
  parameters:
    RetrieveQuery:
      name: query
      in: query
      required: true
      schema:
        type: string
        minLength: 1
      description: Free-text retrieval query.
    RetrieveSource:
      name: source
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
      description: Optional repeatable source identity filter. Empty means all sources and curated pages.
    OperationID:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    QueryStringBadRequest:
      description: Missing or invalid query string.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            query_required:
              value:
                error: query_required
            invalid_request:
              value:
                error: invalid_request
            invalid_source_filter:
              value:
                error: invalid_source_filter
    JSONBodyBadRequest:
      description: Invalid JSON body or invalid request semantics.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_json:
              value:
                error: invalid_json
            multiple_json_values:
              value:
                error: multiple_json_values
            invalid_request:
              value:
                error: invalid_request
    OperationIDBadRequest:
      description: Invalid operation ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: operation_id_invalid
    ScopeOverrideForbidden:
      description: Caller attempted to override the trusted host scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: scope_override_forbidden
    Unauthorized:
      description: The configured operator bearer token is missing or invalid.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: unauthorized
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: not_found
    UnavailableError:
      description: The host is not ready yet or the service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_ready:
              value:
                error: not_ready
            service_unavailable:
              value:
                error: service_unavailable
            maintainer_unavailable:
              value:
                error: maintainer_unavailable
    OperationFailed:
      description: The operation failed or an unclassified application error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: operation_failed
  schemas:
    HealthResponse:
      type: object
      required: [service, status]
      properties:
        service:
          type: string
          example: knowl
        status:
          type: string
          enum: [ok]
    ReadyResponse:
      type: object
      required: [service, status]
      properties:
        service:
          type: string
          example: knowl
        status:
          type: string
          enum: [ready, not_ready]
        scope:
          type: string
          description: Trusted scope reported only when the host is ready.
          example: local
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Citation:
      type: object
      required: [kind, reference, untrusted]
      properties:
        kind:
          type: string
          enum: [wiki, raw]
        reference:
          type: string
        page_id:
          type: string
        path:
          type: string
        source_ref:
          type: string
        untrusted:
          type: boolean
    EvidenceItem:
      type: object
      required: [page_id, title, snippet, untrusted]
      properties:
        page_id:
          type: string
        title:
          type: string
        snippet:
          type: string
        source_refs:
          type: array
          items:
            type: string
        source_documents:
          type: array
          items:
            $ref: '#/components/schemas/SourceDocument'
        source_id:
          type: string
        document_id:
          type: string
        revision:
          type: string
        uri:
          type: string
        okf:
          $ref: '#/components/schemas/OKFMetadata'
        untrusted:
          type: boolean
    SourceDocument:
      type: object
      required: [source_id, document_id, revision, uri]
      properties:
        source_id:
          type: string
        document_id:
          type: string
        revision:
          type: string
        uri:
          type: string
    OKFMetadata:
      type: object
      required: [type]
      properties:
        type:
          type: string
        title:
          type: string
        description:
          type: string
        resource:
          type: string
        tags:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/OKFSource'
        usage_window:
          $ref: '#/components/schemas/OKFUsageWindow'
        generated:
          $ref: '#/components/schemas/OKFGeneration'
        verified:
          type: array
          items:
            $ref: '#/components/schemas/OKFVerification'
        status:
          type: string
          enum: [draft, stable, deprecated]
        stale_after:
          type: string
          format: date-time
        runtime:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/OKFParameter'
        computation:
          type: string
        executor:
          $ref: '#/components/schemas/OKFExecutor'
        attester:
          $ref: '#/components/schemas/OKFAttester'
        extensions:
          $ref: '#/components/schemas/OKFExtensions'
        trust_tier:
          type: string
          enum: [unverified, machine-confirmed, human-reviewed]
        effective_status:
          type: string
          enum: [draft, stable, deprecated]
        stale:
          type: boolean
    OKFSource:
      type: object
      required: [resource]
      properties:
        id:
          type: string
        resource:
          type: string
        title:
          type: string
        author:
          type: string
        usage_count:
          type: integer
          format: uint64
          minimum: 0
        last_modified:
          type: string
          format: date-time
        usage_window:
          $ref: '#/components/schemas/OKFUsageWindow'
        extensions:
          $ref: '#/components/schemas/OKFExtensions'
    OKFUsageWindow:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        extensions:
          $ref: '#/components/schemas/OKFExtensions'
    OKFGeneration:
      type: object
      required: [by]
      properties:
        by:
          type: string
        at:
          type: string
          format: date-time
        extensions:
          $ref: '#/components/schemas/OKFExtensions'
    OKFVerification:
      type: object
      required: [by, at]
      properties:
        by:
          type: string
        at:
          type: string
          format: date-time
        extensions:
          $ref: '#/components/schemas/OKFExtensions'
    OKFParameter:
      type: object
      required: [name, type, required]
      properties:
        name:
          type: string
        type:
          type: string
        required:
          type: boolean
        extensions:
          $ref: '#/components/schemas/OKFExtensions'
    OKFExecutor:
      type: object
      required: [resource]
      properties:
        resource:
          type: string
        receipt:
          type: array
          items:
            type: string
        extensions:
          $ref: '#/components/schemas/OKFExtensions'
    OKFAttester:
      type: object
      required: [resource]
      properties:
        resource:
          type: string
        extensions:
          $ref: '#/components/schemas/OKFExtensions'
    OKFExtensions:
      type: object
      additionalProperties: {}
    RetrieveResult:
      type: object
      required: [query, evidence]
      properties:
        retrieval:
          $ref: '#/components/schemas/RetrievalStatus'
        query:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceItem'
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
    IngestRequest:
      type: object
      properties:
        content:
          type: string
          description: Text already obtained by the caller. Supply exactly one of content or uri.
        uri:
          type: string
          description: URI string stored as reference text, without downloading the document. Use content for document text; supply exactly one of content or uri.
        media_type:
          type: string
        origin:
          type: string
          description: Source identity hint for supplied content, such as its original URL. Not fetched.
        idempotency_key:
          type: string
      additionalProperties: false
    IngestResult:
      type: object
      required: [operation_id, status]
      properties:
        retrieval:
          $ref: '#/components/schemas/RetrievalStatus'
        operation_id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
    Failure:
      type: object
      required: [class, operation_id]
      properties:
        reason:
          type: string
          description: Stable application failure code when classified; no provider error text.
        class:
          type: string
        operation_id:
          type: string
    OperationResult:
      type: object
      required: [id, status, updated_at]
      properties:
        details:
          $ref: '#/components/schemas/OperationDetails'
        retrieval:
          $ref: '#/components/schemas/RetrievalStatus'
        id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        updated_at:
          type: string
          format: date-time
        failure:
          $ref: '#/components/schemas/Failure'
    RetrievalStatus:
      type: object
      additionalProperties: false
      required: [effective]
      properties:
        effective:
          type: string
          enum: [lexical, hybrid, degraded, failed]
        reason:
          type: string
          enum: [invalid_configuration, invalid_input, unavailable, deadline, input_limit, response_limit, invalid_response, model_mismatch, dimension_mismatch, projection_not_ready, projection_drift, projection_capacity]
    DiagnosticCount:
      type: integer
      minimum: 0
      maximum: 2147483647
    RetrievalReason:
      type: string
      enum: [invalid_configuration, invalid_input, unavailable, deadline, input_limit, response_limit, invalid_response, model_mismatch, dimension_mismatch, projection_not_ready, projection_drift, projection_capacity]
    OperationDetails:
      type: object
      additionalProperties: false
      description: Bounded stored facts. Missing evidence is unavailable. Reads do not rerun selection or inference. Details serialize to less than 96 KiB.
      properties:
        correction:
          $ref: '#/components/schemas/OperationCorrectionReport'
        context:
          $ref: '#/components/schemas/OperationContextReport'
        retrieval:
          $ref: '#/components/schemas/RetrievalReport'
        retrieval_attempt:
          $ref: '#/components/schemas/DiagnosticCount'
        plan:
          $ref: '#/components/schemas/OperationPlanSummary'
        warnings:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/MaintenanceWarning'
        warnings_omitted:
          $ref: '#/components/schemas/DiagnosticCount'
        execution:
          $ref: '#/components/schemas/OperationExecutionDetails'
    OperationCorrectionReport:
      type: object
      additionalProperties: false
      required: [version, work_attempt, max_corrections, max_output_bytes, deadline_nanos, outcome]
      description: One immutable report per producing work attempt; at most 1 KiB. Counters measure actual generation turns and accepted-prefix output text across all turns. Unavailable counters are absent. A crash before finalization can leave the report absent.
      properties:
        version:
          type: integer
          enum: [1]
        work_attempt:
          $ref: '#/components/schemas/DiagnosticCount'
        max_corrections:
          type: integer
          minimum: 0
          maximum: 1
        max_output_bytes:
          type: integer
          minimum: 1
          maximum: 1048576
        deadline_nanos:
          type: integer
          format: int64
          minimum: 1
          maximum: 300000000000
        outcome:
          type: string
          enum: [accepted, exhausted, output_limit, deadline, canceled, provider_failed, unavailable]
        turns:
          type: integer
          minimum: 0
          maximum: 2
        corrections:
          type: integer
          minimum: 0
          maximum: 1
        output_bytes:
          type: integer
          minimum: 0
          maximum: 1048576
        validation_code:
          type: string
          enum: [structured_output_invalid, source_plan_invalid, hierarchy_plan_invalid]
    OperationContextReport:
      type: object
      additionalProperties: false
      required: [version, work_attempt, outcome, entries_omitted]
      description: One immutable snapshot per producing work attempt; at most 32 KiB. A crash before finalization can leave it absent.
      properties:
        version:
          type: integer
          enum: [1]
        work_attempt:
          $ref: '#/components/schemas/DiagnosticCount'
        outcome:
          type: string
          enum: [assembled, selection_failed, assembly_failed]
        candidate_count:
          allOf:
            - $ref: '#/components/schemas/DiagnosticCount'
          description: Unique ordinary candidates eligible under the factual page allowance, excluding controls and duplicates. Not a wiki-wide omission count.
        catalog_count:
          allOf:
            - $ref: '#/components/schemas/DiagnosticCount'
          description: Number of catalogs observed when inspection succeeded.
        pages:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ContextPage'
        entries_omitted:
          allOf:
            - $ref: '#/components/schemas/DiagnosticCount'
          description: Candidate entries omitted from this diagnostic list by its bounds; distinct from budget exclusions.
        budget:
          $ref: '#/components/schemas/ContextBudget'
        vector_projection:
          $ref: '#/components/schemas/VectorProjectionStatus'
    ContextPage:
      type: object
      additionalProperties: false
      required: [page_id, selection_reason, disposition]
      properties:
        page_id:
          type: string
          maxLength: 2048
          description: Canonical relative ordinary page ID, additionally limited to 2048 UTF-8 bytes.
        selection_reason:
          type: string
          enum: [lexical, vector, hybrid, neighbor, recent, unknown]
          description: First actual selection phase; unsupported custom indexes report unknown.
        disposition:
          type: string
          enum: [included, budget_omitted, pending]
    ContextBudget:
      type: object
      additionalProperties: false
      required: [max_bytes, included_count, omitted_count]
      properties:
        max_bytes:
          type: integer
          minimum: 1
          maximum: 4194304
        used_bytes:
          allOf:
            - $ref: '#/components/schemas/DiagnosticCount'
          description: Serialized accepted request bytes, or last measured accepted prefix on partial failure. Absent when preflight stopped exact measurement; measured required overflow can exceed max_bytes.
        included_count:
          $ref: '#/components/schemas/DiagnosticCount'
        omitted_count:
          allOf:
            - $ref: '#/components/schemas/DiagnosticCount'
          description: Actual candidates omitted by the request byte budget; pending candidates are not counted.
    VectorProjectionStatus:
      type: object
      additionalProperties: false
      required: [state]
      description: Check observed during the producing attempt, never current projection readiness at poll time.
      properties:
        state:
          type: string
          enum: [not_checked, ready, invalid]
          x-enum-varnames: [VectorNotChecked, VectorReady, VectorInvalid]
        reason:
          $ref: '#/components/schemas/RetrievalReason'
    RetrievalReport:
      type: object
      additionalProperties: false
      required: [requested, effective, lexical_candidates, vector_candidates, fused_candidates, scanned_chunks, query_omitted_runes, index_omitted_chunks, index_omitted_runes]
      properties:
        requested:
          type: string
          enum: [lexical, hybrid]
        effective:
          type: string
          enum: [lexical, hybrid, degraded, failed]
        reason:
          $ref: '#/components/schemas/RetrievalReason'
        model_space:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: Non-secret fingerprint, without model endpoint or credentials.
        lexical_candidates:
          type: integer
          minimum: 0
          maximum: 100
        vector_candidates:
          type: integer
          minimum: 0
          maximum: 100
        fused_candidates:
          type: integer
          minimum: 0
          maximum: 200
        scanned_chunks:
          type: integer
          minimum: 0
          maximum: 8192
        query_omitted_runes:
          $ref: '#/components/schemas/DiagnosticCount'
        index_omitted_chunks:
          $ref: '#/components/schemas/DiagnosticCount'
        index_omitted_runes:
          $ref: '#/components/schemas/DiagnosticCount'
    OperationPlanSummary:
      type: object
      additionalProperties: false
      required: [digest]
      properties:
        digest:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: Stored validated/staged SHA-256 digest, without edits or rationale.
        file_count:
          allOf:
            - $ref: '#/components/schemas/DiagnosticCount'
          description: Stored number of staged files when known. Legacy digest-only rows omit it.
    MaintenanceWarning:
      type: object
      additionalProperties: false
      required: [code, path]
      properties:
        code:
          type: string
          enum: [citation.unknown_source, link.original_unresolved, catalog.dependency_rejected]
        path:
          type: string
          maxLength: 2048
          description: Safe relative identifier, additionally limited to 2048 UTF-8 bytes.
        target:
          type: string
          maxLength: 2048
          description: Safe relative identifier when available; no URL or arbitrary message.
    OperationExecutionDetails:
      type: object
      additionalProperties: false
      required: [work_attempt, retry_attempt, manual_retry_count, apply_attempt]
      properties:
        work_attempt:
          $ref: '#/components/schemas/DiagnosticCount'
        retry_attempt:
          $ref: '#/components/schemas/DiagnosticCount'
        manual_retry_count:
          $ref: '#/components/schemas/DiagnosticCount'
        apply_attempt:
          allOf:
            - $ref: '#/components/schemas/DiagnosticCount'
          description: Existing canonical apply-attempt counter, not inference calls.
        ready_at:
          type: string
          format: date-time
