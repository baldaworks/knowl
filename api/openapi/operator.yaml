      x-go-type: domain.OperatorSourceDetail
      x-go-type-import:
        path: github.com/baldaworks/knowl/pkg/knowl/types
        name: domain
    OperatorOperationSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
        status:
          type: string
        source_id:
          type: string
