openapi: 3.0.3
info:
  title: Knowl operator read API
  version: 1.0.0
  description: 'Opt-in host-bound reads. Exactly seven GET routes, no caller scope/workspace
    selection. Unknown or duplicate query parameters and GET bodies are rejected.
    Total query budget 16 KiB. All data/errors use Cache-Control: no-store. No reads
    start workers or fetch upstream. Canonical snapshot versions describe the current
    read, not historical storage. Token also authorizes existing write endpoints.'
security:
- OperatorBearer: []
paths:
  /operator/v1/catalogs:
    get:
      operationId: getCatalogs
      parameters:
      - name: parent_id
        in: query
        required: false
        schema: &id001
          type: string
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Safe detached read; no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorCatalog'
        '400':
          description: invalid_request, cursor_invalid or limit_invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: scope_override_forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource-specific not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: snapshot_changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: read_limit_exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: unsupported_format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: capability_unavailable, not_ready or workspace_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: internal_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
