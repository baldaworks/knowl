      required:
      - items
      x-go-type: domain.OperatorList[domain.OperatorDocumentSummary]
      x-go-type-import:
        path: github.com/baldaworks/knowl/pkg/knowl/types
        name: domain
    OperatorSourceDetail:
      type: object
      additionalProperties: false
      properties:
        source:
          $ref: '#/components/schemas/OperatorSourceSummary'
        documents:
          $ref: '#/components/schemas/DocumentList'
      required:
