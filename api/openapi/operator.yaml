      - version
      x-go-type: domain.OperatorSourceRevision
      x-go-type-import:
        path: github.com/baldaworks/knowl/pkg/knowl/types
        name: domain
    SyncCounts:
      type: object
      additionalProperties: false
      properties:
        added:
          type: integer
          format: int64
        updated:
          type: integer
          format: int64
        unchanged:
          type: integer
          format: int64
        deleted:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
      required:
      - added
      - updated
      - unchanged
      - deleted
      - failed
      x-go-type: domain.SyncCounts
      x-go-type-import:
        path: github.com/baldaworks/knowl/pkg/knowl/types
        name: domain
    MaintenanceCounts:
      type: object
      additionalProperties: false
      properties:
        queued:
          type: integer
          format: int64
        retrying:
          type: integer
          format: int64
        replayed:
          type: integer
          format: int64
        committed:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
      required:
      - queued
      - retrying
      - replayed
      - committed
      - failed
      x-go-type: domain.MaintenanceCounts
      x-go-type-import:
        path: github.com/baldaworks/knowl/pkg/knowl/types
        name: domain
    OperatorSourceStatus:
      type: object
      additionalProperties: false
      properties:
        status: *id001
        counts:
          $ref: '#/components/schemas/SyncCounts'
        maintenance_counts:
          $ref: '#/components/schemas/MaintenanceCounts'
        last_attempt_at: *id002
        last_successful_at: *id002
        updated_at: *id002
      required:
      - counts
      - maintenance_counts
      - updated_at
      x-go-type: domain.OperatorSourceStatus
      x-go-type-import:
        path: github.com/baldaworks/knowl/pkg/knowl/types
        name: domain
    OperatorSourceSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        type:
          type: string
        enabled: *id003
        status:
          $ref: '#/components/schemas/OperatorSourceStatus'
      required:
      - id
