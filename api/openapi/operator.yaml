      - enabled
      x-go-type: domain.OperatorSourceSummary
      x-go-type-import:
        path: github.com/baldaworks/knowl/pkg/knowl/types
        name: domain
    OperatorDocumentSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        revision:
