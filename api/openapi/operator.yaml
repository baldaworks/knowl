components:
  securitySchemes:
    OperatorBearer:
      type: http
      scheme: bearer
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 8192
      description: Signed process-local cursor; restart invalidates it with cursor_invalid.
        Bound to endpoint, scope, filters, limit and canonical snapshot where applicable.
  schemas:
    OperatorCatalogSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
      required:
      - id
      - title
      x-go-type: domain.OperatorCatalogSummary
      x-go-type-import:
        path: github.com/baldaworks/knowl/pkg/knowl/types
        name: domain
    OperatorCatalogChild:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        kind:
          type: string
        description:
          type: string
      required:
      - id
      - title
      - kind
      x-go-type: domain.OperatorCatalogChild
      x-go-type-import:
        path: github.com/baldaworks/knowl/pkg/knowl/types
        name: domain
    OperatorCatalog:
      type: object
      additionalProperties: false
      properties:
        parent:
          $ref: '#/components/schemas/OperatorCatalogSummary'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperatorCatalogChild'
        next_cursor: *id001
        snapshot_version: *id001
      required:
      - parent
      - items
      - snapshot_version
      x-go-type: domain.OperatorCatalog
      x-go-type-import:
        path: github.com/baldaworks/knowl/pkg/knowl/types
        name: domain
    OperatorPageSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        digest:
          type: string
        version:
          type: string
        updated_at: &id002
          type: string
          format: date-time
      required:
      - id
      - title
      - digest
      - version
      - updated_at
      x-go-type: domain.OperatorPageSummary
      x-go-type-import:
        path: github.com/baldaworks/knowl/pkg/knowl/types
        name: domain
    OperatorPageMetadata:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
        description:
          type: string
        status:
          type: string
        trust_tier:
          type: string
        tags:
          type: array
          items: *id001
        stale: &id003
          type: boolean
      required:
      - stale
      x-go-type: domain.OperatorPageMetadata
      x-go-type-import:
        path: github.com/baldaworks/knowl/pkg/knowl/types
        name: domain
    OperatorPageSource:
      type: object
      additionalProperties: false
      properties:
        source_ref:
          type: string
        source_id:
          type: string
        document_id:
          type: string
        revision:
          type: string
        original_uri:
          type: string
      required:
      - source_ref
      - revision
      x-go-type: domain.OperatorPageSource
      x-go-type-import:
        path: github.com/baldaworks/knowl/pkg/knowl/types
        name: domain
    OperatorPage:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        markdown:
          type: string
        digest:
          type: string
        version:
          type: string
        metadata:
          $ref: '#/components/schemas/OperatorPageMetadata'
        related_page_ids:
          type: array
          items: *id001
          nullable: true
        sources:
          type: array
          items:
            $ref: '#/components/schemas/OperatorPageSource'
          nullable: true
      required:
      - id
      - title
      - markdown
      - digest
      - version
      - related_page_ids
      - sources
      x-go-type: domain.OperatorPage
      x-go-type-import:
        path: github.com/baldaworks/knowl/pkg/knowl/types
        name: domain
    SourceRef:
      type: object
      additionalProperties: false
      properties:
        adapter:
          type: string
        id:
          type: string
      required:
      - adapter
      - id
      x-go-type: domain.SourceRef
      x-go-type-import:
        path: github.com/baldaworks/knowl/pkg/knowl/types
        name: domain
    SourceVersion:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
        digest:
          type: string
      required:
      - version
